name: Hourly news refresh
on:
  schedule:
    # Runs at the top of every hour (UTC). GitHub may delay a few minutes
    # under load, which is expected and fine for an hourly refresh.
    - cron: "0 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: hourly-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r scripts/requirements.txt
      - name: Fetch news and rewrite index.html
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: python scripts/fetch_news.py
      - name: Commit and push if changed
        run: |
          git config user.name "12F Automation"
          git config user.email "ai@12f.news"
          if git diff --quiet -- index.html archive.json status.txt; then
            echo "No changes -- skipping commit."
          else
            git add index.html archive.json status.txt
            git commit -m "Automated hourly news refresh"
            # Someone else (a manual push, an overlapping delayed run) may have
            # moved origin/main since we checked out -- rebase onto it and
            # retry the push a couple of times instead of silently losing
            # this run's refresh to a rejected non-fast-forward push.
            success=0
            for attempt in 1 2 3; do
              if git push; then
                success=1
                break
              fi
              echo "Push rejected (attempt $attempt) -- fetching and rebasing before retrying."
              git fetch origin main
              git rebase origin/main
            done
            if [ "$success" != "1" ]; then
              echo "::error::Could not push the automated refresh after retrying -- this run's update was lost."
              exit 1
            fi
          fi
